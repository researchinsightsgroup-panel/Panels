<style>
/* Layout: split screen. Brand panel (blue gradient, steps) on the left, one short step at a time on the right; on phones the panel shrinks to a header bar with progress. */
:root{
  --bg:#eef0f3; --card:#ffffff; --line:#d9dde3; --soft:#e4e7ec;
  --ink:#13264d; --muted:#596173; --faint:#868c99;
  --navy:#13285a; --coral:#a44b3b; --coral-ink:#8f3e30; --coral-soft:#f3e2de;
  --ok:#2f7d5b; --bad:#b5402e; --bad-soft:#f8e3de;
  --blue-a:#143f5c; --blue-b:#3d9ed3; --on-grad:#f5f1ea;
  --sel:#13285a; --sel-ink:#ffffff;
  --serif:"Source Serif 4","Iowan Old Style",Georgia,serif; --sans:"Figtree","Noto Sans Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151c;--card:#1a1f29;--line:#2a3345;--soft:#1c2433;--ink:#e7ebf3;--muted:#a3abbb;--faint:#7b8496;--navy:#8fa8e8;--coral:#c9624f;--coral-ink:#e08a78;--coral-soft:#2e1d1a;--ok:#5fbf92;--bad:#ec7b66;--bad-soft:#331c19;--sel:#8fa8e8;--sel-ink:#0f1420;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151c;--card:#1a1f29;--line:#2a3345;--soft:#1c2433;--ink:#e7ebf3;--muted:#a3abbb;--faint:#7b8496;--navy:#8fa8e8;--coral:#c9624f;--coral-ink:#e08a78;--coral-soft:#2e1d1a;--ok:#5fbf92;--bad:#ec7b66;--bad-soft:#331c19;--sel:#8fa8e8;--sel-ink:#0f1420;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)} body{min-height:100vh}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
button,input,select{font:inherit;color:inherit}

.shell{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);min-height:100vh}
@media (max-width:860px){.shell{grid-template-columns:1fr;min-height:0}}

/* brand panel */
.aside{background:linear-gradient(160deg,var(--blue-a),var(--blue-b));color:var(--on-grad);padding:40px 36px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.mark{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em}
.mark .dot{min-width:34px;padding:0 7px;width:auto;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-family:var(--serif);font-size:17px}
.aside h1{font-size:clamp(30px,3vw,40px);line-height:1.08}
.aside p{margin:0;opacity:.9;max-width:34ch}
.perks{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;font-size:14.5px}
.perks li{display:flex;gap:10px;align-items:flex-start}
.perks svg{flex:none;margin-top:3px}
.steps{list-style:none;margin:auto 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:14px}
.steps li{display:flex;align-items:center;gap:10px;padding:6px 0;opacity:.6}
.steps li.done{opacity:.85} .steps li.now{opacity:1;font-weight:600}
.steps i{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:11px;flex:none}
.steps li.done i{background:var(--on-grad);color:var(--blue-a);border-color:var(--on-grad)}
.steps li.now i{background:rgba(255,255,255,.2)}
@media (max-width:860px){
  .aside{position:static;height:auto;padding:18px 16px 16px;gap:10px}
  .aside .intro,.perks,.steps{display:none}
  .aside .mobile-progress{display:flex}
}
.mobile-progress{display:none;align-items:center;gap:12px;font-size:13px}
.mobile-progress .track{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.mobile-progress .fill{height:100%;background:var(--on-grad);border-radius:4px;transition:width .3s}

/* main column */
.main{display:flex;flex-direction:column;padding-inline:clamp(16px,5vw,72px);padding-block:clamp(24px,6vh,72px) 32px;min-width:0}
.preview{background:var(--coral-soft);color:var(--coral-ink);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:24px;max-width:640px}
.stage{max-width:640px;width:100%;flex:1}
.count{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
.stage h2{font-size:clamp(28px,4vw,40px);line-height:1.12;margin-bottom:8px}
.stage .sub{color:var(--muted);margin:0 0 28px;max-width:56ch}
.stage.anim{animation:rise .28s ease-out}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stage.anim{animation:none}.mobile-progress .fill{transition:none}}

.q{margin-bottom:26px;border:0;padding:0;min-width:0}
.q>legend,.q>label.ql{display:block;font-weight:600;font-size:15.5px;margin-bottom:10px;padding:0}
.q .hint{font-size:13.5px;color:var(--muted);margin:-4px 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opts.wide{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt .o{display:flex;align-items:center;gap:10px;min-height:52px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);font-weight:500;transition:border-color .15s,background .15s;cursor:pointer}
.opt .o b{font-family:var(--serif);font-weight:600;font-size:13px;letter-spacing:.04em;width:30px;height:24px;border-radius:6px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--muted)}
.opt .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.opt:hover .o{border-color:var(--faint)}
.opt input:checked+.o{border-color:var(--sel);background:var(--sel);color:var(--sel-ink)}
.opt input:checked+.o b{background:rgba(255,255,255,.18);color:inherit}
.opt input:checked+.o small{color:inherit;opacity:.85}
.opt input:focus-visible+.o{outline:2px solid var(--coral);outline-offset:2px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:13px 14px;min-height:52px;width:100%}
.field input:focus,.field select:focus{border-color:var(--sel);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--sel) 18%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.tel{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.tel:focus-within{border-color:var(--sel);box-shadow:0 0 0 3px color-mix(in srgb,var(--sel) 18%,transparent)}
.tel span{display:grid;place-items:center;padding:0 14px;background:var(--soft);font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.tel input{border:0;border-radius:0;min-height:52px;padding:13px 14px;flex:1;min-width:0;background:transparent;font-variant-numeric:tabular-nums}
.tel input:focus{outline:none}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--sel);flex:none}
.err{color:var(--bad);font-size:13.5px;margin-top:8px;font-weight:500}
.suggest{font-size:13.5px;margin-top:6px;color:var(--muted)} .suggest button{all:unset;cursor:pointer;color:var(--coral-ink);font-weight:600;text-decoration:underline}

.nav{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:14px 26px;font-weight:600;cursor:pointer;min-height:50px}
.btn.primary{background:var(--coral);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{background:transparent;color:var(--muted);padding-inline:14px}
.btn:disabled{opacity:.55;cursor:default}
.keyhint{font-size:12.5px;color:var(--faint)}
@media (hover:none){.keyhint{display:none}}

.review{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:22px}
.review div{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:baseline;font-size:14.5px}
.review div:first-child{border-top:0}
.review dt{color:var(--muted)} .review dd{margin:0;overflow-wrap:anywhere}
.review button{all:unset;cursor:pointer;color:var(--coral-ink);font-weight:600;font-size:13.5px}
.review button:focus-visible{outline:2px solid var(--coral)}
.note{font-size:13.5px;color:var(--muted)}
.big-ok{width:64px;height:64px;border-radius:50%;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);display:grid;place-items:center;margin-bottom:22px}
.alert{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:14.5px}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;opacity:0}
.foot{margin-top:40px;font-size:12.5px;color:var(--faint);max-width:640px}

.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;color:var(--on-grad);font:600 12.5px/1 var(--sans);padding:7px 10px;border-radius:999px;cursor:pointer;min-width:34px}
.langs button[aria-pressed="true"]{background:var(--on-grad);color:var(--blue-a)}
.langs button:focus-visible{outline:2px solid var(--on-grad);outline-offset:2px}
.csearch{margin-bottom:16px;max-width:420px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#q-country .opts{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{font-family:"Noto Naskh Arabic",var(--serif)}
[dir="rtl"] .count,[dir="rtl"] .langs button{letter-spacing:0}
.tel span{direction:ltr}
</style>

</div>

<script>
(() => {
'use strict';
/* ===== settings: paste the web app address from Google Apps Script here ===== */
const CONFIG = { endpoint: 'https://script.google.com/macros/s/AKfycbwdKPEWCeKJg0mabLOpXxTRyNTV5KrdQsOYCliHaGnsH_6UfrG3TAs40Rmu_y0XfJOY/exec' };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const C = PANEL_COUNTRIES;
const LANGS = ['en', 'fr', 'ar', 'pt'];

/* ===== answer lists (saved values are English and match the panel sheet) ===== */

const CONTACT = [['Email', 'Email'], ['Messaging apps (e.g., WhatsApp)', 'WhatsApp'], ['SMS/Text message', 'SMS'], ['Phone call', 'Phone call']];
const OTHER = '__other';
const YEAR = new Date().getFullYear();

const HH = ['1', '2', '3', '4', '5', '6+'];

const TURNOVER = ['Under $50,000', '$50,000 – $250,000', '$250,000 – $1 million', '$1 – 10 million', '$10 – 50 million', 'Over $50 million', "Don't know"];

/* ===== state ===== */
let A = {}, step = 0, sending = false, started = Date.now(), errs = {}, lang = 'en', langChosen = false, cfilter = '';
try { const d = JSON.parse(localStorage.getItem('ri-panel-draft') || 'null'); if (d && d.A) { A = d.A; step = Math.min(d.step || 0, 11); lang = d.lang || lang; langChosen = !!d.langChosen; if (d.started) started = d.started; } } catch {}
if (!langChosen) { const nav = String(navigator.language || 'en').slice(0, 2); if (LANGS.includes(nav)) lang = nav; }
try { const ref = (new URLSearchParams(location.search).get('ref') || '').slice(0, 30); if (ref && !A.ref) A.ref = ref; } catch {}
// Campaign links can open on one panel: ?panel=b2b, ?panel=b2c or ?panel=both
try { const p = { b2b: 'B2B', business: 'B2B', b2c: 'B2C', consumer: 'B2C', both: 'Both' }[(new URLSearchParams(location.search).get('panel') || '').toLowerCase()]; if (p && !A.panel) A.panel = p; } catch {}
const save = () => { try { localStorage.setItem('ri-panel-draft', JSON.stringify({ A, step, lang, langChosen, started })); } catch {} };

/* ===== wording ===== */
const T = (k, vars) => { let s = (I18N[lang] && I18N[lang][k]) ?? I18N.en[k] ?? k; if (vars) for (const [a, b] of Object.entries(vars)) s = s.split('{' + a + '}').join(b); return s; };
const L = v => (lang !== 'en' && OPT[lang] && OPT[lang][v]) || v;
let regionNames = null;
try { regionNames = new Intl.DisplayNames([lang], { type: 'region' }); } catch {}
const cname = k => { try { const n = regionNames && regionNames.of(k); if (n && n !== k) return n; } catch {} return C[k].name; };
const langLabel = v => ENDONYM[v] || v;

/* ===== country helpers ===== */
const cx = () => C[A.country] || null;
const digits = s => String(s || '').replace(/\D/g, '');
function localPart(raw, c) {
  let d = digits(raw).replace(/^00/, '');
  if (d.startsWith(c.cc) && d.length > c.len[1]) d = d.slice(c.cc.length);
  if (c.keep0) { if (!d.startsWith('0') && d.length === c.len[1] - 1) d = '0' + d; }
  else d = d.replace(/^0/, '');
  return d;
}
const phoneOk = (raw, c) => { const d = localPart(raw, c); return d.length >= c.len[0] && d.length <= c.len[1] && (!c.first || new RegExp(c.first).test(d)); };
const intl = (raw, c) => '+' + c.cc + localPart(raw, c);
const emailOk = s => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s || '').trim());
const TYPO = { 'gmial.com': 'gmail.com', 'gmai.com': 'gmail.com', 'gmail.co': 'gmail.com', 'gamil.com': 'gmail.com', 'yahoo.co': 'yahoo.com', 'yaho.com': 'yahoo.com', 'hotmial.com': 'hotmail.com', 'outlok.com': 'outlook.com', 'yahoo.fr.com': 'yahoo.fr' };
const town = () => A.town === OTHER ? (A.townOther || '').trim() : A.town;
const unitOf = () => (cx()?.geo.units || []).find(u => u[0] === A.unit) || null;
const unitLabel = () => T('u_' + (cx()?.geo.label || 'region'));
const lc = s => lang === 'ar' ? s : s.toLowerCase();
const ageOf = () => YEAR - (+A.yob || YEAR);
const ageBand = a => a < 18 ? 'Under 18' : a <= 24 ? '18-24' : a <= 34 ? '25-34' : a <= 44 ? '35-44' : a <= 54 ? '45-54' : a <= 64 ? '55-64' : '65 and above';
const isB2B = () => A.panel === 'B2B' || A.panel === 'Both';
const isB2C = () => A.panel !== 'B2B';
const panelLabel = () => L((PANELS.find(p => p[0] === A.panel) || [])[1] || '');
const payLabel = (c, k) => L((c.pay.find(p => p[0] === k) || [])[1] || '');

/* ===== steps ===== */
const STEPS = [
  { key: 'welcome' }, { key: 'country' }, { key: 'panel' }, { key: 'you' }, { key: 'contact' }, { key: 'home' },
  { key: 'household', skip: () => !isB2C() }, { key: 'study' }, { key: 'business', skip: () => !isB2B() },
  { key: 'income', skip: () => !cx()?.income || !isB2C() }, { key: 'rewards' }, { key: 'review' },
];
const visible = () => STEPS.filter(s => !s.skip || !s.skip());

function choice(name, opts, { wide = false, codes = false } = {}) {
  return `<div class="opts${wide ? ' wide' : ''}" role="radiogroup">` + opts.map(o => {
    const [v, l, sm] = Array.isArray(o) ? o : [o, o];
    return `<label class="opt"><input type="radio" name="${name}" value="${esc(v)}" ${A[name] === v ? 'checked' : ''}><span class="o">${codes ? `<b>${esc(v)}</b>` : ''}<span class="t">${esc(L(l))}${sm ? `<small>${esc(L(sm))}</small>` : ''}</span></span></label>`;
  }).join('') + '</div>';
}
function multi(name, opts) {
  const cur = A[name] || [];
  return '<div class="opts wide">' + opts.map(v => `<label class="opt"><input type="checkbox" name="${name}" value="${esc(v)}" ${cur.includes(v) ? 'checked' : ''}><span class="o"><span class="t">${esc(L(v))}</span></span></label>`).join('') + '</div>';
}
const sel = (name, opts, label, labelFn = L) => `<div class="field"><select id="${name}" name="${name}" aria-label="${esc(label)}"><option value="">${T('choose')}</option>${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(A[name]) === String(v) ? 'selected' : ''}>${esc(labelFn(l))}</option>`; }).join('')}</select></div>`;
const err = k => errs[k] ? `<p class="err" id="e-${k}">${esc(errs[k])}</p>` : '';
const q = (k, label, body, hint) => `<fieldset class="q" id="q-${k}"><legend>${esc(label)}</legend>${hint ? `<p class="hint">${esc(hint)}</p>` : ''}${body}${err(k)}</fieldset>`;
function head(title, sub) { const v = visible(), i = v.findIndex(s => s.key === STEPS[step].key);
  return `<p class="count">${T('stepOf', { i, n: v.length - 1 })}</p><h2>${esc(title)}</h2>${sub ? `<p class="sub">${esc(sub)}</p>` : '<div style="height:20px"></div>'}`; }
function suggestion() { const m = String(A.email || '').toLowerCase().match(/@(.+)$/); const fix = m && TYPO[m[1]];
  return fix ? `<p class="suggest">${T('didYouMean', { x: `<button type="button" id="fixmail">${esc(A.email.replace(/@.+$/, '@' + fix))}</button>` })}</p>` : ''; }
function countryCards() {
  const f = cfilter.trim().toLowerCase();
  const list = Object.keys(C).map(k => [k, cname(k)]).filter(([k, n]) => !f || n.toLowerCase().includes(f) || C[k].name.toLowerCase().includes(f) || k.toLowerCase() === f)
    .sort((a, b) => a[1].localeCompare(b[1], lang));
  return list.length ? choice('country', list, { codes: true }) : `<p class="note">${T('cNone')}</p>`;
}

const VIEWS = {
  welcome: () => `<p class="count">${T('wCount')}</p><h2>${T('wH')}</h2><p class="sub">${T('wSub')}</p>
    <div class="nav"><button class="btn primary" type="submit">${A.country ? T('resume') : T('start')}</button>${A.country ? `<button class="btn ghost" type="button" id="restart">${T('restart')}</button>` : ''}</div>`,
  country: () => head(T('cH'), T('cSub')) +
    `<div class="field csearch"><input id="csearch" type="search" placeholder="${esc(T('cSearch'))}" aria-label="${esc(T('cSearch'))}" value="${esc(cfilter)}" autocomplete="off"></div>` +
    `<fieldset class="q" id="q-country"><legend class="vh">${T('cLegend')}</legend><div id="clist">${countryCards()}</div>${err('country')}</fieldset>`,
  panel: () => head(T('pH'), T('pSub')) +
    `<fieldset class="q" id="q-panel"><legend class="vh">${T('pLegend')}</legend>${choice('panel', PANELS, { wide: true })}${err('panel')}</fieldset>`,
  you: () => { const c = cx(); return head(T('yH'), T('ySub')) +
    `<div class="row2">${q('yob', T('yob'), sel('yob', YEARS.map(String).concat([[String(YEAR - 17) + '+', T('orLater', { y: YEAR - 17 })]]), T('yob'), x => x))}${q('lang', T('lang'), sel('lang', c.langs.includes('English') ? c.langs : c.langs.concat(['English']), T('lang'), langLabel))}</div>` +
    q('gender', T('gender'), choice('gender', ['Female', 'Male'])); },
  contact: () => { const c = cx(); return head(T('ctH'), T('ctSub')) +
    `<div class="row2 q"><div class="field"><label class="ql" for="first">${T('first')}</label><input id="first" name="first" autocomplete="given-name" value="${esc(A.first)}">${err('first')}</div>
     <div class="field"><label class="ql" for="last">${T('last')}</label><input id="last" name="last" autocomplete="family-name" value="${esc(A.last)}">${err('last')}</div></div>
     <div class="q field"><label class="ql" for="email">${T('email')}</label><input id="email" name="email" type="email" inputmode="email" autocomplete="email" dir="ltr" value="${esc(A.email)}">${suggestion()}${err('email')}</div>
     <div class="q field"><label class="ql" for="phone">${T('phone')}</label><div class="tel" dir="ltr"><span>+${c.cc}</span><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="${c.example}" value="${esc(A.phone)}"></div>${err('phone')}</div>
     <div class="row2">${q('heard', T('heard'), sel('heard', HEARD, T('heard')))}<div class="q field"><label class="ql" for="ref">${T('ref')} <span class="note">${T('optional')}</span></label><input id="ref" name="ref" value="${esc(A.ref)}" autocomplete="off"></div></div>`; },
  home: () => { const c = cx(), ul = unitLabel(), unit = unitOf(); return head(T('hH', { c: cname(A.country) }), T('hSub')) +
    `<div class="row2 q"><div class="field"><label class="ql" for="unit">${esc(ul)}</label><select id="unit" name="unit"><option value="">${T('choose')}</option>${c.geo.units.map(u => `<option ${A.unit === u[0] ? 'selected' : ''}>${esc(u[0])}</option>`).join('')}</select>${err('unit')}</div>
     <div class="field"><label class="ql" for="town">${T('town')}</label><select id="town" name="town" ${unit ? '' : 'disabled'}><option value="">${unit ? T('choose') : esc(T('pickUnitFirst', { u: lc(ul) }))}</option>${unit ? unit[2].map(t => `<option ${A.town === t ? 'selected' : ''}>${esc(t)}</option>`).join('') + `<option value="${OTHER}" ${A.town === OTHER ? 'selected' : ''}>${esc(T('elsewhereIn', { u: unit[0] }))}</option>` : ''}</select>${err('town')}</div></div>
     ${A.town === OTHER ? `<div class="q field"><label class="ql" for="townOther">${T('townOther')}</label><input id="townOther" name="townOther" value="${esc(A.townOther)}">${err('townOther')}</div>` : ''}` +
    q('area', T('area'), choice('area', AREA, { wide: true })); },
  household: () => head(T('hhH'), T('hhSub')) +
    q('hh', T('hhQ'), choice('hh', HH)) +

    (A.kids && A.kids !== 'None' ? q('kidAges', T('kidAgesQ'), multi('kidAges', KID_AGES), T('tickAll')) : '') +

    q('items', T('itemsQ'), multi('items', ITEMS), T('itemsHint')),
  study: () => { const b = isB2B(); return head(T('stH'), '') +

      ${A.samePay === false ? `<div class="field" style="margin-top:12px"><label class="ql" for="payNo">${T('payNo')}</label><div class="tel" dir="ltr"><span>+${c.cc}</span><input id="payNo" name="payNo" type="tel" inputmode="tel" placeholder="${c.example}" value="${esc(A.payNo)}"></div>${err('payNo')}</div>` : ''}</div>` : ''); },
  review: () => { const c = cx(), ltr = s => `<bdi dir="ltr">${esc(s)}</bdi>`;
    const rows = [
      [T('vName'), esc(`${A.first} ${A.last}`), 'contact'], [T('vEmail'), ltr(A.email), 'contact'], [T('vMobile'), ltr(intl(A.phone, c)), 'contact'], [T('vCountry'), esc(cname(A.country)), 'country'], [T('vPanel'), esc(panelLabel()), 'panel'],
      [T('vAbout'), esc(`${T('vBorn', { y: String(A.yob).replace('+', '') })} · ${L(A.gender)} · ${langLabel(A.lang)}`), 'you'],
      [T('vLives'), esc(`${town()}, ${A.unit}${cx().geo.mode === 'admin' ? ' (' + (unitOf() || [])[1] + ')' : ''} · ${L(A.area)}`), 'home'],
      ...(isB2C() ? [[T('vHH'), esc(`${A.hh === '1' ? T('vPerson') : T('vPeople', { n: A.hh })} · ${T('vChildren', { n: L(A.kids) })}${(A.kidAges || []).length ? ' (' + A.kidAges.map(L).join(', ') + ')' : ''} · ${L((SHOP.find(x => x[0] === A.shopper) || [])[1] || '')}`), 'household']] : []),
      [T('vEdu'), esc(L(A.edu)), 'study'],
      ...(isB2B() ? [[T('vWork'), esc(L(A.occ)), 'study'],
        [T('vBiz'), esc([A.jobTitle, A.company, L(A.sen), L(A.ind), L(A.func), L(A.size)].filter(Boolean).join(' · ')), 'business'],
        [T('vBuy'), esc([L((PROLE.find(x => x[0] === A.prole) || [])[1] || ''), L(A.turn), (A.areas || []).map(L).join(', ')].filter(Boolean).join(' · ')), 'business']]
      : [[T('vWork'), esc([L(A.occ), A.occ === 'Employed' ? L(A.ind) : '', A.occ === 'Employed' ? L(A.mgmt) : '', A.size ? L(A.size) : ''].filter(Boolean).join(' · ')), 'study']]),
      ...(c.income && isB2C() ? [[T('vInc'), esc(T('vMonth', { x: A.inc })), 'income']] : []),
      [T('vPhone'), esc(`${L(A.net)} · ${L((PHONE.find(p => p[0] === A.ptype) || [])[1] || '')}`), 'rewards'],
      [T('vInv'), esc(L((CONTACT.find(x => x[0] === A.contact) || [])[1] || '')), 'rewards'],
      [T('vRew'), esc(payLabel(c, A.pay)) + (A.samePay === false && A.payNo ? ' ' + T('vTo', { n: ltr(intl(A.payNo, c)) }) : ''), 'rewards']];
    return head(T('vH'), T('vSub')) +
      (errs.submit ? `<div class="alert" role="alert">${esc(errs.submit)}</div>` : '') +
      `<dl class="review">${rows.map(([k, v, s]) => `<div><dt>${esc(k)}</dt><dd>${v}</dd><button type="button" data-goto="${s}">${T('change')}</button></div>`).join('')}</dl>
      <div class="q"><label class="check"><input type="checkbox" id="consent" ${A.consent ? 'checked' : ''}><span id="consentText">${esc(T('consent', { ch: L((CONTACT.find(x => x[0] === A.contact) || [])[1] || '') || T('myChannel') }) + (isB2B() ? ' ' + T('consentB2B') : ''))}</span></label>${err('consent')}</div>
      <input class="hp" tabindex="-1" autocomplete="off" id="website" aria-hidden="true">`; },
};

/* ===== validation ===== */
function check(key) {
  const e = {}, c = cx();
  const need = (k, msg) => { if (!A[k] || !String(A[k]).trim()) e[k] = msg; };
  if (key === 'country') need('country', T('e_country'));
  if (key === 'panel') need('panel', T('e_pick'));
  if (key === 'you') { need('yob', T('e_yob')); need('lang', T('e_lang')); need('gender', T('e_pick')); }
  if (key === 'contact') {
    need('first', T('e_first')); need('last', T('e_last'));
    if (!emailOk(A.email)) e.email = T('e_email');
    if (!phoneOk(A.phone, c)) e.phone = T('e_phone', { c: cname(A.country), d: c.len[0] === c.len[1] ? c.len[0] : c.len[0] + '–' + c.len[1], cc: c.cc, ex: c.example });
    need('heard', T('e_pick'));
  }
  if (key === 'home') { need('unit', T('e_unit', { u: lc(unitLabel()) })); need('town', T('e_town')); if (A.town === OTHER) need('townOther', T('e_townOther')); need('area', T('e_pick')); }
  if (key === 'household') { need('hh', T('e_pick')); need('kids', T('e_pick')); if (A.kids && A.kids !== 'None' && !(A.kidAges || []).length) e.kidAges = T('e_kidAges'); need('shopper', T('e_pick')); }
  if (key === 'study') { need('edu', T('e_pick')); need('occ', T('e_pick'));
    if (isB2B()) { if (A.occ && !WORKING.includes(A.occ)) e.occ = T('bizOnly'); }
    else { if (A.occ === 'Employed') { need('ind', T('e_pick')); need('func', T('e_pick')); need('mgmt', T('e_pick')); } if (WORKING.includes(A.occ)) need('size', T('e_pick')); } }
  if (key === 'business') {
    need('jobTitle', T('e_title')); ['ind', 'func', 'sen', 'size', 'turn', 'prole'].forEach(k => need(k, T('e_pick')));
    if (!(A.areas || []).length) e.areas = T('e_areas');
    if (String(A.workEmail || '').trim() && !emailOk(A.workEmail)) e.workEmail = T('e_workEmail');
  }
  if (key === 'income') need('inc', T('e_inc'));
  if (key === 'rewards') { need('net', T('e_pick')); need('ptype', T('e_pick')); need('contact', T('e_pick')); need('pay', T('e_pick'));
    if (A.samePay === false && MOBILE_PAY.has(A.pay) && !phoneOk(A.payNo, c)) e.payNo = T('e_phone', { c: cname(A.country), d: c.len[1], cc: c.cc, ex: c.example }); }
  if (key === 'review' && !A.consent) e.consent = T('e_consent');
  return e;
}

/* ===== rendering ===== */
const form = $('form');
function applyLang() {
  const t = I18N[lang] || I18N.en;
  document.documentElement.lang = lang; document.documentElement.dir = t.dir;
  try { regionNames = new Intl.DisplayNames([lang], { type: 'region' }); } catch { regionNames = null; }
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T(el.dataset.t));
  $('langs').innerHTML = LANGS.map(l => `<button type="button" data-lang="${l}" aria-pressed="${l === lang}" lang="${l}">${l === 'ar' ? 'ع' : l.toUpperCase()}</button>`).join('');
}
function render(anim = true) {
  const k = STEPS[step].key;
  if (k !== 'welcome' && k !== 'country' && !cx()) { step = 1; return render(); }
  form.innerHTML = VIEWS[k]() + (k === 'welcome' ? '' : `<div class="nav"><button class="btn primary" type="submit" ${sending ? 'disabled' : ''}>${k === 'review' ? (sending ? T('joining') : T('join')) : T('cont')}</button><button class="btn ghost" type="button" id="back">${T('back')}</button><span class="keyhint">${T('keyhint')}</span></div>`);
  form.classList.remove('anim'); if (anim) { void form.offsetWidth; form.classList.add('anim'); }
  const v = visible(), i = Math.max(0, v.findIndex(s => s.key === k));
  $('steps').innerHTML = v.slice(1).map((s, j) => `<li class="${j + 1 < i ? 'done' : j + 1 === i ? 'now' : ''}"><i>${j + 1 < i ? '✓' : j + 1}</i>${T('s_' + s.key)}</li>`).join('');
  $('mp-text').textContent = i ? T('stepOf', { i, n: v.length - 1 }) : T('about');
  $('mp-fill').style.width = (i / (v.length - 1) * 100) + '%';
  const firstErr = form.querySelector('.err');
  if (firstErr) firstErr.closest('.q,.field')?.querySelector('input,select')?.focus();
  else if (anim && k !== 'welcome' && k !== 'country') form.querySelector('input:not([type=radio]):not([type=checkbox]),select')?.focus({ preventScroll: true });
}
function go(to) { errs = {}; step = to; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function next() {
  const k = STEPS[step].key; errs = check(k);
  if (k === 'you' && A.yob && (String(A.yob).includes('+') || ageOf() < 18)) return underage();
  if (Object.keys(errs).length) { render(false); return; }
  if (k === 'review') return submit();
  let n = step + 1; while (STEPS[n].skip && STEPS[n].skip()) n++;
  go(n);
}
function back() { let n = step - 1; while (n > 0 && STEPS[n].skip && STEPS[n].skip()) n--; go(Math.max(0, n)); }
function underage() {
  clearDraft(); A = {};
  form.innerHTML = `<p class="count">${T('thanks')}</p><h2>${T('uH')}</h2><p class="sub">${T('uP')}</p>`;
  $('steps').innerHTML = ''; $('mp-fill').style.width = '100%';
}

/* ===== events ===== */
$('langs').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (!b) return; lang = b.dataset.lang; langChosen = true; save(); applyLang(); errs = {}; render(false); });
form.addEventListener('submit', e => { e.preventDefault(); if (sending) return; if (STEPS[step].key === 'welcome') { started = Date.now(); go(A.country ? Math.max(1, step || 1) : 1); return; } next(); });
form.addEventListener('change', e => {
  const t = e.target;
  if (t.type === 'radio') {
    const prev = A[t.name]; A[t.name] = t.value; save();
    if (t.name === 'country') {
      if (prev && prev !== t.value) { ['unit', 'region', 'town', 'townOther', 'inc', 'pay', 'lang', 'net'].forEach(k => delete A[k]); }
      if (!langChosen && C[t.value].ui && C[t.value].ui !== lang) { lang = C[t.value].ui; applyLang(); }
    }
    if (t.name === 'panel' && isB2B() && A.occ && !WORKING.includes(A.occ)) delete A.occ;
    if (errs[t.name]) delete errs[t.name];
    const k = STEPS[step].key;
    if ((k === 'study' && t.name === 'occ') || (k === 'rewards' && t.name === 'pay') || (k === 'household' && t.name === 'kids')) { render(false); return; }
    if (['country', 'panel', 'income'].includes(k)) { setTimeout(next, 220); return; }
    form.querySelectorAll('.err').forEach(x => { if (x.id === 'e-' + t.name) x.remove(); });
    return;
  }
  if (t.type === 'checkbox' && t.name === 'areas') {   // "None of these" can't sit with other purchases
    let cur = new Set(A.areas || []); t.checked ? cur.add(t.value) : cur.delete(t.value);
    if (t.checked) cur = t.value === NONE_AREA ? new Set([NONE_AREA]) : new Set([...cur].filter(v => v !== NONE_AREA));
    A.areas = [...cur]; save(); delete errs.areas; render(false); return;
  }
  if (t.type === 'checkbox' && t.name) { const cur = new Set(A[t.name] || []); t.checked ? cur.add(t.value) : cur.delete(t.value); A[t.name] = [...cur]; save(); if (errs[t.name]) { delete errs[t.name]; form.querySelector('#e-' + t.name)?.remove(); } return; }
  if (t.id === 'samePay') { A.samePay = t.checked; save(); render(false); return; }
  if (t.id === 'consent') { A.consent = t.checked; save(); return; }
  if (t.tagName === 'SELECT') {
    A[t.name] = t.value; save();
    if (errs[t.name]) { delete errs[t.name]; form.querySelector('#e-' + t.name)?.remove(); }
    if (t.name === 'yob' && String(t.value).includes('+')) { setTimeout(underage, 150); return; }
    if (t.name === 'unit') { delete A.town; delete A.townOther; render(false); form.querySelector('#town')?.focus(); return; }
    if (t.name === 'town') render(false);
  }
});
form.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'csearch') { cfilter = t.value; $('clist').innerHTML = countryCards(); return; }
  if (t.name && t.type !== 'radio' && t.type !== 'checkbox') { A[t.name] = t.value; save(); if (errs[t.name] && String(t.value).trim()) { delete errs[t.name]; form.querySelector('#e-' + t.name)?.remove(); } }
});
form.addEventListener('keydown', e => { if (e.target.id === 'csearch' && e.key === 'Enter') { e.preventDefault(); const r = form.querySelectorAll('#clist input[type=radio]'); if (r.length === 1) { r[0].checked = true; r[0].dispatchEvent(new Event('change', { bubbles: true })); } } });
form.addEventListener('focusout', e => { if (e.target.id === 'email') { const s = form.querySelector('.suggest'); const html = suggestion(); if (!s && html) e.target.insertAdjacentHTML('afterend', html); } });
form.addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'back') back();
  if (t.id === 'restart') { A = {}; clearDraft(); go(1); }
  if (t.id === 'fixmail') { A.email = t.textContent; save(); render(false); }
  if (t.dataset && t.dataset.goto) go(STEPS.findIndex(s => s.key === t.dataset.goto));
});

/* ===== submit ===== */
function payload() {
  const c = cx(), mobile = MOBILE_PAY.has(A.pay), b = isB2B(), hh = isB2C(), emp = A.occ === 'Employed';
  return {
    country: c.name, countryCode: A.country, email: A.email.trim(), phone: intl(A.phone, c), first: A.first.trim(), last: A.last.trim(),
    gender: A.gender, age: ageBand(ageOf()), yob: String(A.yob), language: A.lang, panelType: A.panel,
    householdSize: hh ? A.hh : '', children: hh ? A.kids : '', childAges: hh && A.kids !== 'None' ? (A.kidAges || []).join(', ') : '', shopper: hh ? A.shopper : '',
    items: hh ? (A.items || []).join(', ') : '', itemsScore: hh ? (A.items || []).length : '',
    companySize: WORKING.includes(A.occ) ? A.size : '', jobFunction: (b || emp) ? A.func : '',
    network: A.net, phoneType: A.ptype, heard: A.heard, referral: (A.ref || '').trim(),
    region: (unitOf() || [])[1] || '', subRegion: c.geo.mode === 'admin' ? A.unit : '', town: town(), area: A.area, education: A.edu, occupation: A.occ,
    industry: (b || emp) ? A.ind : '', management: b ? (emp ? SEN_MGMT[A.sen] || '' : '') : (emp ? A.mgmt : ''), income: c.income && hh ? A.inc : '',
    company: b ? (A.company || '').trim() : '', jobTitle: b ? (A.jobTitle || '').trim() : '', seniority: b ? A.sen : '', turnover: b ? A.turn : '',
    purchaseRole: b ? A.prole : '', decisionAreas: b ? (A.areas || []).join(', ') : '', workEmail: b ? (A.workEmail || '').trim() : '',
    contact: A.contact, payMethod: A.pay, payNumber: mobile ? (A.samePay === false ? intl(A.payNo, c) : intl(A.phone, c)) : '',
    consent: 'Yes', consentText: $('consentText')?.textContent || '', uiLang: lang, website: $('website')?.value || '', elapsedMs: Date.now() - started,
  };
}
async function submit() {
  const data = payload();
  if (!CONFIG.endpoint) { done(true); return; }
  sending = true; errs = {}; render(false);
  try {
    const r = await fetch(CONFIG.endpoint, { method: 'POST', body: JSON.stringify(data) });
    const j = await r.json().catch(() => ({}));
    sending = false;
    if (j.ok) return done(false, j.memberId);
    // The server refuses sign-ups finished in under 20 seconds (a bot check). A person who resumed saved answers can be that quick: wait out the rest and send again.
    if (j.code === 'too_fast' && !submit.retried) { submit.retried = true; sending = true; render(false); await new Promise(r => setTimeout(r, Math.max(0, 21000 - (Date.now() - started)))); submit.retried = false; return submit(); }
    submit.retried = false;
    errs.submit = j.code === 'duplicate' ? T('x_dup') : (j.message && lang === 'en' ? j.message : T('x_fail')); render(false);
  } catch { sending = false; errs.submit = T('x_net'); render(false); }
}
function done(preview, memberId) {
  const name = A.first; clearDraft(); A = {}; step = 0;
  form.classList.remove('anim'); void form.offsetWidth; form.classList.add('anim');
  form.innerHTML = `<div class="big-ok"><svg width="30" height="30" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <p class="count">${T('okCount')}</p><h2>${esc(T('okH', { name }))}</h2>
    <p class="sub">${preview ? T('okPreview') : T('okP')}</p>${memberId ? `<p class="note">${T('okId', { id: '<b dir="ltr" style="font-variant-numeric:tabular-nums">' + esc(memberId) + '</b>' })}</p>` : ''}`;
  $('steps').querySelectorAll('li').forEach(li => { li.className = 'done'; li.querySelector('i').textContent = '✓'; });
  $('mp-fill').style.width = '100%'; $('mp-text').textContent = T('doneTxt');
}

$('preview').hidden = !!CONFIG.endpoint;
applyLang(); render(false);
})();
</script>
